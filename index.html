<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animacion interaktiv</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f6f7fb;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #5b6075;
    -webkit-tap-highlight-color: transparent;
  }
  main { flex: 1; display: flex; flex-direction: column; gap: 28px; align-items: center; justify-content: center; width: 100%; }

  .scene {
    position: relative; width: min(70vw, 280px); aspect-ratio: 1;
    cursor: pointer; outline: none;
    transition: filter .6s ease;
  }
  .scene:focus-visible { outline: 2px solid #6c63ff; outline-offset: 12px; border-radius: 50%; }

  .core {
    position: absolute; inset: 35%;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c63ff, #ff7a9c);
    box-shadow: 0 10px 30px rgba(108, 99, 255, .35);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(.85); } 50% { transform: scale(1.15); } }

  .ring {
    position: absolute; inset: 0;
    border: 2px dashed #d7d9ea;
    border-radius: 50%;
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dot {
    position: absolute; top: 50%; left: 50%;
    width: 16px; height: 16px; margin: -8px;
    transform: rotate(var(--a)) translateY(calc(min(70vw, 280px) / -2));
  }
  .dot::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--c); }

  /* Grimcat që shpërthejnë kur klikohet */
  .spark { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; pointer-events: none; }

  .hint { font-size: 14px; }
  footer { padding: 20px; font-size: 14px; }
</style>
</head>
<body>
  <main>
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Kliko për të shkaktuar një shpërthim">
      <div class="ring" id="ring"></div>
      <div class="core" id="core"></div>
    </div>
    <p class="hint">Kliko rrethin</p>
  </main>
  <footer>Punoi: Joel</footer>

<script>
  const colors = ["#6c63ff", "#ff7a9c", "#ffb84d", "#3ecfb2", "#4da3ff", "#b36cff"];
  const scene = document.getElementById("scene");
  const ring = document.getElementById("ring");
  const core = document.getElementById("core");

  colors.forEach((c, i) => {
    const d = document.createElement("span");
    d.className = "dot";
    d.style.setProperty("--a", (i * 360 / colors.length) + "deg");
    d.style.setProperty("--c", c);
    ring.appendChild(d);
  });

  let hue = 0, rafId = null;

  function burst() {
    const size = scene.offsetWidth, n = 16;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "spark";
      s.style.background = colors[i % colors.length];
      scene.appendChild(s);
      const ang = (i / n) * Math.PI * 2, dist = size * (0.55 + Math.random() * 0.35);
      s.animate(
        [{ transform: "translate(0,0) scale(1)", opacity: 1 },
         { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist}px) scale(.2)`, opacity: 0 }],
        { duration: 900, easing: "cubic-bezier(.2,.8,.3,1)" }
      ).onfinish = () => s.remove();
    }
  }

  function react() {
    burst();
    // Rrethi qendror "kërcen"
    core.animate([{ scale: 1 }, { scale: 1.6 }, { scale: 1 }], { duration: 550, easing: "ease-out" });
    // Ngjyrat ndryshojnë
    hue += 60;
    scene.style.filter = `hue-rotate(${hue}deg)`;
    // Unaza rrotullohet shpejt dhe pastaj ngadalësohet
    const anim = ring.getAnimations()[0];
    let rate = 10;
    cancelAnimationFrame(rafId);
    (function ease() {
      rate = 1 + (rate - 1) * 0.96;
      anim.playbackRate = rate;
      if (rate > 1.02) rafId = requestAnimationFrame(ease); else anim.playbackRate = 1;
    })();
  }

  scene.addEventListener("click", react);
  scene.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); react(); }
  });
</script>
</body>
</html>
